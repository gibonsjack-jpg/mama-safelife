<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAMA SAFELIFE - LIVE DASHBOARD</title>

  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
    h1 { margin-bottom: 5px; color: #38bdf8; }
    p.subtitle { margin-bottom: 25px; color: #94a3b8; }
    .container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; max-width: 800px; width: 100%; }
    .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; width: 220px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    .card h3 { font-size: 1.1rem; color: #94a3b8; margin-bottom: 10px; }
    .value { font-size: 2.2rem; font-weight: bold; color: #38bdf8; margin-bottom: 5px; }
    .unit { font-size: 0.9rem; color: #64748b; }
    .status-box { margin-top: 10px; padding: 6px 12px; border-radius: 20px; font-size: 0.9rem; font-weight: bold; background: #334155; display: inline-block; }
    .footer { margin-top: 40px; font-size: 0.85rem; color: #64748b; }
  </style>
</head>
<body>

  <h1>MAMA SAFELIFE</h1>
  <p class="subtitle">Live Vitals Monitoring Dashboard</p>

  <div class="container">
    <div class="card">
      <h3>Joto la Mwili</h3>
      <div id="temp" class="value">--</div>
      <span class="unit">°C</span>
    </div>

    <div class="card">
      <h3>Hali ya Mgonjwa</h3>
      <div id="hali" class="status-box">Inasubiri...</div>
    </div>

    <div class="card">
      <h3>Muda wa Mwisho</h3>
      <div id="muda" class="value" style="font-size: 1.2rem; margin-top: 15px;">--:--</div>
    </div>
  </div>

  <div class="footer">
    INNOVATED BY GIBONS JACK (MUST CITT)
  </div>

  <script>
    // Config halisi kutoka Firebase Console yako
    const firebaseConfig = {
      apiKey: "AIzaSyACzCxV6CYqr_gzDdKD18jYmMdeUQsK14k",
      authDomain: "mama-safelife-216a3.firebaseapp.com",
      databaseURL: "https://mama-safelife-216a3-default-rtdb.firebaseio.com",
      projectId: "mama-safelife-216a3",
      storageBucket: "mama-safelife-216a3.firebasestorage.app",
      messagingSenderId: "782977810443",
      appId: "1:782977810443:web:5e0003c3c3c6f79974470e"
    };

    // Kuanzisha Firebase App
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Kusikiliza mabadiliko LIVE kutoka Firebase
    database.ref('vitals').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        document.getElementById('temp').innerText = data.temperature !== undefined ? data.temperature.toFixed(1) : '--';
        document.getElementById('hali').innerText = data.hali || '--';
        
        const sasa = new Date();
        document.getElementById('muda').innerText = sasa.toLocaleTimeString();
      }
    });
  </script>
</body>
</html>
