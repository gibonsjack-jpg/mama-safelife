<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAMA-SAFELIFE - Mfumo Kamili</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<!-- Leaflet Map Library -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
    *{box-sizing:border-box;font-family:'Segoe UI',sans-serif;margin:0;padding:0}
    body{background:#f4f7f6;color:#1e2a3a;min-height:100vh;font-size:14px}
    
    /* LOGIN */
    #loginPage{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:url('https://upload.wikimedia.org/wikipedia/commons/3/38/Flag_of_Tanzania.svg') center/cover fixed;position:relative}
    #loginPage::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.65)}
    .lc{position:relative;z-index:2;background:#fff;width:100%;max-width:400px;padding:24px;border-radius:16px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5)}
    .lc h1{color:#1b5e20;font-size:1.7rem;font-weight:800}
    .lc .sl{color:#1eb954;font-size:.75rem;font-weight:700;letter-spacing:1px;margin:2px 0 16px}
    .gov{font-size:.65rem;font-weight:700;color:#1b5e20;text-transform:uppercase}.gov b{color:#0d47a1}
    .fg{margin-bottom:12px;text-align:left}.fg label{font-size:.8rem;font-weight:700;margin-bottom:3px;display:block}
    input,select,textarea{width:100%;padding:10px;border:2px solid #dde1e6;border-radius:8px;font-size:15px;background:#fafbfc;margin-bottom:8px}
    input:focus,select:focus,textarea:focus{border-color:#1eb954;outline:none;background:#fff}
    .btn{width:100%;padding:12px;background:linear-gradient(135deg,#1eb954,#138a3c);color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:800;cursor:pointer}
    .foot{margin-top:14px;padding-top:12px;border-top:1px solid #eee;font-size:.65rem;color:#333;font-weight:600}.foot b{color:#c62828;display:block;margin-top:2px;text-transform:uppercase}

    /* DASHBOARD */
    #dashboardPage{display:none;flex-direction:column;min-height:100vh}
    .navbar{background:#1b5e20;color:#fff;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;border-bottom:4px solid #fcd116}
    .navbar h2{font-size:.95rem;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .navbar button{color:#fff;background:rgba(255,255,255,.18);padding:6px 12px;border-radius:20px;font-size:.8rem;font-weight:700;cursor:pointer;border:none}
    .wrap{padding:12px;max-width:1300px;margin:0 auto;flex:1;width:100%}
    .card{background:#fff;padding:14px;border-radius:10px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
    .card h3{margin:0 0 8px;padding-bottom:6px;border-bottom:2px solid #e8f5e9;font-size:1rem;color:#1b5e20}
    table{width:100%;border-collapse:collapse;font-size:.75rem;margin-top:6px}
    th,td{border:1px solid #ddd;padding:6px;text-align:left}th{background:#f8f9fa}
    .btn2{padding:5px 10px;font-size:.7rem;border-radius:4px;border:none;color:#fff;cursor:pointer;margin:2px}
    .b-g{background:#2e7d32}.b-r{background:#c62828}.b-b{background:#0277bd}.b-o{background:#e65100}.b-p{background:#6a1b9a}
    .badge{padding:2px 6px;border-radius:4px;font-size:.65rem;font-weight:bold;color:#fff}
    .bg-g{background:#2e7d32}.bg-y{background:#f57f17}.bg-r{background:#c62828}.bg-b{background:#0277bd}
    
    /* LIVE DATA */
    .live{background:linear-gradient(135deg,#e8f5e9,#c8e6c9);padding:12px;border-radius:10px;display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;border:2px solid #1b5e20}
    .vi{background:#fff;padding:6px 10px;border-radius:8px;min-width:75px;text-align:center;box-shadow:0 2px 4px rgba(0,0,0,.05)}
    .vi .l{font-size:.6rem;font-weight:800;color:#1b5e20;text-transform:uppercase}.vi .v{font-size:1.3rem;font-weight:800;color:#1b5e20}
    
    /* ALARM */
    .em{background:#fff5f5;border:2px solid #d32f2f;border-radius:10px;padding:15px;text-align:center;margin-bottom:12px}
    .pulse{width:100px;height:100px;background:#d32f2f;color:#fff;border:none;border-radius:50%;font-size:.9rem;font-weight:800;cursor:pointer;margin:10px auto;animation:p 2s infinite;display:flex;align-items:center;justify-content:center}
    @keyframes p{0%{transform:scale(.95)}70%{transform:scale(1)}100%{transform:scale(.95)}}
    .alert-overlay{display:none;position:fixed;inset:0;background:rgba(200,0,0,.85);z-index:9999;justify-content:center;align-items:center;padding:20px}
    .alert-overlay.on{display:flex}
    .alert-box{background:#fff;border-radius:15px;padding:20px;max-width:450px;width:100%;text-align:center;animation:shake 0.5s infinite;box-shadow:0 10px 40px rgba(0,0,0,.5)}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
    
    /* TRIAGE */
    .triage-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:15px}
    .t-card{background:#fff;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.05);overflow:hidden;border-top:4px solid #ccc}
    .t-card.risk{border-top-color:#c62828}.t-card.monit{border-top-color:#ff9800}.t-card.norm{border-top-color:#2e7d32}
    .t-head{padding:10px 12px;font-weight:bold;font-size:0.9rem;background:#f8f9fa;display:flex;justify-content:space-between}
    .t-list{list-style:none;padding:0;margin:0;max-height:250px;overflow-y:auto}
    .t-list li{padding:10px 12px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
    .t-list li:hover{background:#f0f8ff}
    .p-name{font-weight:bold;color:#1b5e20;font-size:0.85rem}.p-meta{font-size:0.7rem;color:#666}
    
    /* MODALS & CHARTS */
    .mod{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;justify-content:center;align-items:center;padding:15px}
    .mod.on{display:flex}
    .mc{background:#fff;border-radius:12px;padding:18px;width:100%;max-width:650px;max-height:90vh;overflow:auto}
    .chart-box{position:relative;height:220px;width:100%;margin-top:10px}
    
    /* GPS MAP */
    #driverMap { height: 300px; width: 100%; border-radius: 10px; border: 2px solid #1b5e20; margin-top: 10px; }

    @media(max-width:600px){.triage-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage">
  <div class="lc">
    <div class="gov">Jamhuri ya Muungano wa Tanzania</div>
    <div class="gov"><b>Wizara ya Afya</b></div>
    <h1 style="margin-top:6px">MAMA-SAFELIFE</h1>
    <div class="sl">WE CARE · WE MONITOR</div>
    <form onsubmit="handleLogin(event)">
      <div class="fg"><label>Jina / Simu</label><input id="loginUsername" placeholder="0674377704" required></div>
      <div class="fg"><label>Neno la Siri</label><input type="password" id="loginPassword" placeholder="••••" required></div>
      <div class="fg"><label>Wadhifa</label>
        <select id="loginRole" required>
          <option value="">-- Chagua --</option>
          <option value="mteja">Mteja / Mama Mjawazito</option>
          <option value="chw">CHW</option>
          <option value="driver">Dereva wa Ambulance</option>
          <option value="nurse_labour">Labour Ward</option>
          <option value="nurse_postnatal">Postnatal Ward</option>
          <option value="nurse_rch">RCH Clinic</option>
          <option value="nurse_theater">Theater</option>
          <option value="lab_tech">Maabara</option>
          <option value="coordinator">Mratibu M-Mama</option>
          <option value="admin">Administrator</option>
        </select>
      </div>
      <button type="submit" class="btn">INGIA</button>
    </form>
    <div class="foot">© Mbeya University of Science and Technology<b>Innovated by Gibons (MUST CITT)</b></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboardPage">
  <div class="navbar">
    <h2><span id="displayName">Mtumiaji</span> · <span id="displayRole">Portal</span></h2>
    <div><button onclick="logout()">🚪 Toka</button></div>
  </div>
  <div class="wrap" id="dashboardContent"></div>
</div>

<!-- MODALS -->
<div id="patientModal" class="mod">
  <div class="mc">
    <h2 style="color:#1565c0;border-bottom-color:#90caf9">📑 Kadi na Vipimo vya Mteja</h2>
    <div id="patientModalContent"></div>
    <button class="btn b-b" style="margin-top:15px" onclick="document.getElementById('patientModal').classList.remove('on')">FUNGA</button>
  </div>
</div>

<div id="redirectModal" class="mod">
  <div class="mc">
    <h2 style="color:#c62828">🔄 Elekeza Dharura</h2>
    <input type="hidden" id="redirectEmgId">
    <label>Chagua Mhudumu:</label>
    <select id="redirectTo">
      <option value="Dr. Fabiani">Dr. Fabiani (Daktari Mkuu)</option>
      <option value="Dr. Juma">Dr. Juma (Upasuaji)</option>
      <option value="Nurse Zainab">Nurse Zainab (Labour)</option>
      <option value="Nurse Grace">Nurse Grace (Postnatal)</option>
    </select>
    <label>Ujumbe:</label>
    <textarea id="redirectNote" rows="2" placeholder="Nisaidie..."></textarea>
    <div style="display:flex;gap:10px;margin-top:10px">
      <button class="btn b-r" style="flex:1" onclick="confirmRedirect()">TUMA</button>
      <button class="btn" style="flex:1;background:#888" onclick="document.getElementById('redirectModal').classList.remove('on')">FUNGA</button>
    </div>
  </div>
</div>

<div id="alarmOverlay" class="alert-overlay">
  <div class="alert-box">
    <h2>🚨 DHARURA IMETUMWA!</h2>
    <div class="alert-src" id="alarmSource" style="background:#ffebee;color:#c62828;padding:8px;border-radius:6px;font-weight:bold;margin-bottom:10px;font-size:.9rem">Kutoka: --</div>
    <div class="alert-details" id="alarmDetails" style="background:#f0f8ff;text-align:left;padding:10px;border-radius:6px;font-size:.85rem;margin-bottom:10px;line-height:1.5"></div>
    <textarea id="alarmComment" rows="2" placeholder="Maoni yako..." style="margin-bottom:10px"></textarea>
    <div class="alert-actions" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <button style="background:#2e7d32;color:#fff;padding:12px;border-radius:6px;font-weight:bold;font-size:.9rem;border:none;cursor:pointer" onclick="respondEmergency('coming')">✅ NAJA</button>
      <button style="background:#e65100;color:#fff;padding:12px;border-radius:6px;font-weight:bold;font-size:.9rem;border:none;cursor:pointer" onclick="respondEmergency('busy')">⏸️ BUSY</button>
    </div>
    <button style="margin-top:8px;background:#888;color:#fff;border:none;padding:8px;border-radius:6px;width:100%;cursor:pointer" onclick="stopRingLoop(); document.getElementById('alarmOverlay').classList.remove('on')">FUNGA MLIO</button>
  </div>
</div>

<script>
// ================= FIREBASE =================
firebase.initializeApp({
  apiKey: "AIzaSyAC2cXvXcYqr_gzDkD18jYmdeUQskI4k",
  databaseURL: "https://mama-safelife-216a3-default-rtdb.firebaseio.com",
  projectId: "mama-safelife-216a3",
  storageBucket: "mama-safelife-216a3.firebasestorage.app",
  messagingSenderId: "782977810443",
  appId: "1:782977810443:web:5e0083c3c3c6f79974470e"
});
const db = firebase.database();
const DEV = 'M0005';
const USER = '0674377704', PASS = '1234';
const MAX_ALARM_AGE_MS = 5 * 60 * 1000;

if(!sessionStorage.getItem('msl_sess_id')) sessionStorage.setItem('msl_sess_id', 'sess_' + Date.now() + Math.random().toString(36).slice(2, 6));
const MY_SESSION = sessionStorage.getItem('msl_sess_id');
const $ = id => document.getElementById(id);
let myRole = '', curEmg = null, audioCtx = null, ringInt = null, oscs = [], myChart = null, driverMap = null;

// ================= HELPERS =================
const fmt = (n,d=0) => (n==null||isNaN(n))?'--':Number(n).toFixed(d);
async function dbGet(path, fallback) { try { const s = await db.ref(path).once('value'); return s.val() !== null ? s.val() : fallback; } catch(e) { return fallback; } }
async function dbSet(path, val) { try { await db.ref(path).set(val); } catch(e) {} }

async function getClients() { return await dbGet('clientsData', {}); }
async function getClient(n) { const a = await getClients(); return a[n] || {}; }
async function setClient(n, d) { const a = await getClients(); a[n] = { ...a[n], ...d }; await dbSet('clientsData', a); }
async function getReferrals() { return await dbGet('referrals', []); }
async function addReferral(r) { const a = await getReferrals(); r.id = Date.now(); r.status = 'pending'; a.push(r); await dbSet('referrals', a); }
async function updateReferral(id, u) { const a = await getReferrals(); const i = a.findIndex(x => x.id === id); if (i > -1) { a[i] = { ...a[i], ...u }; await dbSet('referrals', a); } }
async function getTransfers() { return await dbGet('transferRequests', []); }
async function updateTransfer(id, u) { const a = await getTransfers(); const i = a.findIndex(x => x.id === id); if (i > -1) { a[i] = { ...a[i], ...u }; await dbSet('transferRequests', a); } }

function fmtTime(ts) { if(!ts) return '-'; const d = new Date(ts); return d.toLocaleTimeString('sw-TZ', {hour:'2-digit', minute:'2-digit'}); }
function isFresh(ts) { return (Date.now() - ts) < MAX_ALARM_AGE_MS; }

// ================= AUTH =================
function handleLogin(e) {
  e.preventDefault();
  const u = $('loginUsername').value.trim(), p = $('loginPassword').value.trim(), r = $('loginRole').value;
  if (u !== USER || p !== PASS) { alert('Taarifa si sahihi. Tumia: ' + USER + ' / ' + PASS); return; }
  sessionStorage.setItem('msl_logged', 'true'); sessionStorage.setItem('msl_user', u); sessionStorage.setItem('msl_role', r);
  $('loginPage').style.display = 'none'; $('dashboardPage').style.display = 'flex';
  $('displayName').textContent = u;
  const RL = { mteja:'Mteja', chw:'CHW', driver:'Dereva', nurse_labour:'Labour Ward', nurse_postnatal:'Postnatal Ward', nurse_rch:'RCH Clinic', nurse_theater:'Theater', lab_tech:'Maabara', coordinator:'Mratibu', admin:'Admin' };
  $('displayRole').textContent = RL[r] || r;
  myRole = r;
  buildDashboard(r);
  startEmergencyListener();
  fetchLiveVitals(); setInterval(fetchLiveVitals, 5000);
}

function logout() { if(!confirm('Toka?')) return; stopRingLoop(); sessionStorage.clear(); location.reload(); }

// ================= LIVE VITALS =================
let LV = { temp: 0, sys: 0, dia: 0, pulse: 0, fhr: 0 };
async function fetchLiveVitals() {
  try {
    const s = await db.ref('vitals/' + DEV).once('value'); const d = s.val();
    if (!d) return;
    LV = { temp: parseFloat(d.temperature)||0, sys: parseInt(d.systolic)||0, dia: parseInt(d.diastolic)||0, pulse: parseInt(d.pulse)||0, fhr: parseInt(d.fhr)||0 };
    document.querySelectorAll('.live-temp').forEach(e => e.textContent = LV.temp.toFixed(1));
    document.querySelectorAll('.live-bp').forEach(e => e.textContent = `${LV.sys}/${LV.dia}`);
    document.querySelectorAll('.live-pulse').forEach(e => e.textContent = LV.pulse);
    document.querySelectorAll('.live-fhr').forEach(e => e.textContent = LV.fhr);
    if (myRole === 'mteja' && myChart) {
      myChart.data.labels.push(fmtTime(Date.now()));
      myChart.data.datasets[0].data.push(LV.temp);
      myChart.data.datasets[1].data.push(LV.sys);
      if (myChart.data.labels.length > 10) { myChart.data.labels.shift(); myChart.data.datasets.forEach(ds => ds.data.shift()); }
      myChart.update();
    }
  } catch(e) {}
}

// ================= ALARM SYSTEM =================
function playBeep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const n = (f,t,d) => { const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=f; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(0.1,audioCtx.currentTime+t); g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+t+d); o.start(audioCtx.currentTime+t); o.stop(audioCtx.currentTime+t+d); oscs.push(o); };
    n(880,0,0.2); n(660,0.25,0.2); n(880,0.5,0.2);
  } catch(e) {}
}
function startRingLoop() { if(ringInt) return; playBeep(); ringInt = setInterval(playBeep, 1600); if(navigator.vibrate) navigator.vibrate([500,200,500]); }
function stopRingLoop() { if(ringInt) clearInterval(ringInt); ringInt=null; oscs.forEach(o=>{try{o.stop();o.disconnect()}catch(e){}}); oscs=[]; if(navigator.vibrate) navigator.vibrate(0); }

function startEmergencyListener() {
  db.ref('emergencies').on('value', snap => {
    const data = snap.val() || {};
    const active = Object.entries(data).map(([id,v]) => ({id, ...v})).filter(e => e.status === 'active' && isFresh(e.timestamp)).sort((a,b) => b.timestamp - a.timestamp);
    const myAlarms = active.filter(e => {
      if (e.sessionId === MY_SESSION) return false;
      const isWard = (e.sourceWard === 'Labour Ward' || e.sourceWard === 'Postnatal Ward');
      if (isWard) return ['chw','driver','coordinator'].includes(myRole);
      return ['admin','coordinator','nurse_labour','nurse_postnatal','nurse_theater','nurse_rch','lab_tech','chw','driver'].includes(myRole);
    });
    if (myAlarms.length > 0 && !curEmg) showAlarmModal(myAlarms[0]);
    if (curEmg && !active.find(e => e.id === curEmg.id)) { stopRingLoop(); $('alarmOverlay').classList.remove('on'); curEmg = null; }
  });
}

function showAlarmModal(e) {
  curEmg = e;
  $('alarmSource').textContent = `Kutoka: ${e.sourceWard || e.role}`;
  const d = e.clientDetails || {};
  $('alarmDetails').innerHTML = `<p><b>Mteja:</b> ${e.clientName || d.name || '-'}</p><p><b>Simu:</b> ${d.phone || '-'}</p><p><b>Eneo:</b> ${d.location || '-'}</p><p><b>Aina:</b> ${e.type}</p>`;
  $('alarmOverlay').classList.add('on');
  startRingLoop();
}

async function respondEmergency(action) {
  if (!curEmg) return;
  const comment = $('alarmComment').value.trim(), id = curEmg.id, me = sessionStorage.getItem('msl_user');
  stopRingLoop(); $('alarmOverlay').classList.remove('on');
  if (action === 'coming') {
    await db.ref('emergencies/' + id).update({ status: 'responding', respondedBy: me, respondedRole: myRole, respondedAt: Date.now(), comment: comment||'-' });
    alert('✅ Umethibitisha NAJA.');
  } else {
    await db.ref('emergencies/' + id).update({ status: 'active', redirectedTo: 'Mwingine', redirectNote: comment||'Nisaidie' });
    alert('✅ Dharura imeelekezwa.');
  }
  curEmg = null; $('alarmComment').value = '';
}

async function triggerEmergency(type) {
  const user = sessionStorage.getItem('msl_user');
  const wardMap = { nurse_labour:'Labour Ward', nurse_theater:'Theater', nurse_postnatal:'Postnatal Ward', nurse_rch:'RCH Clinic', lab_tech:'Maabara', chw:'CHW', admin:'Admin', coordinator:'Mratibu', driver:'Dereva', mteja:'Mteja' };
  const srcWard = wardMap[myRole] || myRole;
  let cName = 'Mgonjwa', cDet = {};
  const sel = $('labourPatientSelect') || $('mtejaPatientSelect') || $('chwPatientSelect');
  if (sel && sel.value) { cName = sel.value; cDet = await getClient(cName); }
  else if (myRole === 'mteja') { cName = user; cDet = await getClient(user); }
  await db.ref('emergencies/emg_' + Date.now()).set({ type, sourceWard: srcWard, role: myRole, user, clientName: cName, clientDetails: cDet, sessionId: MY_SESSION, timestamp: Date.now(), status: 'active' });
  playBeep(); alert('🚨 DHARURA IMETUMWA!');
}

// ================= PATIENT VIEW & CHART =================
async function viewPatient(name) {
  const d = await getClient(name);
  const visits = (d.visits || []).slice(-5);
  let vHtml = visits.map((v,i) => `<tr><td>${i+1}</td><td>${v.date||'-'}</td><td>${v.hospital||d.location||'-'}</td><td>${v.servedBy||'Daktari'}</td><td>${v.bp||'-'}</td><td>${v.temp||'-'}</td></tr>`).join('') || '<tr><td colspan="6">Hakuna.</td></tr>';
  
  $('patientModalContent').innerHTML = `
    <div style="text-align:center;margin-bottom:15px"><h3 style="color:#1b5e20">${d.name||name}</h3><p>📞 ${d.phone||'-'} | 📍 ${d.location||'-'}</p></div>
    <div style="background:#f0f8ff;padding:15px;border-radius:8px;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px">
      <div><b>Mume:</b> ${d.partner||'-'}</div><div><b>Gravida/Para:</b> ${d.gravida||'-'}/${d.para||'-'}</div>
      <div><b>CHW:</b> ${d.chwName||'Amina'}</div><div><b>Mwenyekiti:</b> ${d.mwenyekiti||'Juma'}</div>
    </div>
    <h4 style="margin-bottom:10px;color:#1565c0">📋 Historia ya Mahudhurio (5)</h4>
    <table><thead><tr><th>#</th><th>Tarehe</th><th>Hospitali</th><th>Mhudumu</th><th>BP</th><th>Joto</th></tr></thead><tbody>${vHtml}</tbody></table>
    <h4 style="margin-top:20px;margin-bottom:10px;color:#1565c0">📈 Grafu ya Vipimo</h4>
    <div class="chart-box"><canvas id="pChart"></canvas></div>
  `;
  $('patientModal').classList.add('on');

  setTimeout(() => {
    const ctx = $('pChart'); if(!ctx) return; if(myChart) myChart.destroy();
    myChart = new Chart(ctx, {
      type: 'bar',
      data: { labels: visits.map(v=>v.date||'-'), datasets: [{ label: 'BP (Sys)', data: visits.map(v=>parseInt(v.bp)||0), backgroundColor: '#1565c0' }] },
      options: { responsive: true, maintainAspectRatio: false }
    });
  }, 200);
}

// ================= MAPS =================
function initDriverMap() {
  const mapDiv = $('driverMap');
  if (!mapDiv) return;
  if (driverMap) { driverMap.remove(); }
  
  // Tunduma, Songwe coordinates as default
  driverMap = L.map('driverMap').setView([-9.3, 32.78], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(driverMap);
  
  // Custom Icon
  const icon = L.divIcon({
    className: 'custom-div-icon',
    html: "<div style='background-color:#d32f2f;color:white;padding:5px;border-radius:50%;font-size:20px;'>📍</div>",
    iconSize: [30, 30],
    iconAnchor: [15, 30]
  });
  
  L.marker([-9.3, 32.78], {icon: icon}).addTo(driverMap)
    .bindPopup("<b>Mteja Alipo:</b><br>Bina Juma<br>Nyumba Na. 12, Sogea St").openPopup();
}

// ================= EXTRA ACTIONS =================
async function addContact(e) {
  e.preventDefault(); const u = sessionStorage.getItem('msl_user'); const d = await getClient(u);
  d.importantContacts = d.importantContacts || []; d.importantContacts.push({name: $('cName').value, phone: $('cPhone').value, relationship: $('cRel').value});
  await setClient(u,d); buildDashboard('mteja');
}
async function delContact(i) { const u = sessionStorage.getItem('msl_user'); const d = await getClient(u); d.importantContacts.splice(i,1); await setClient(u,d); buildDashboard('mteja'); }
async function schedSurg(e) { e.preventDefault(); const a = await dbGet('surgeries',[]); a.push({clientName: $('surgClient').value, date: $('surgDate').value, reason: $('surgReason').value, status: 'Pending'}); await dbSet('surgeries', a); alert('✅ Imepangwa!'); buildDashboard('nurse_theater'); }
async function reqSupply(e) { e.preventDefault(); const a = await dbGet('theaterSupplies',{}); a[Date.now()] = {clientName: $('supClient').value, type: $('supType').value, details: $('supDetails').value, timestamp: Date.now()}; await dbSet('theaterSupplies', a); alert('✅ Limetumwa!'); buildDashboard('nurse_theater'); }
async function appTrans(id) { await updateTransfer(id, {status: 'approved'}); alert('✅ Imekubaliwa!'); buildDashboard('coordinator'); }
async function receiveTheaterRef(id) { await updateReferral(id, {status: 'approved'}); alert('✅ Umepokea!'); buildDashboard('nurse_theater'); }

window.viewPatient = viewPatient;
window.addContact = addContact; window.delContact = delContact;
window.schedSurg = schedSurg; window.reqSupply = reqSupply; window.appTrans = appTrans; window.receiveTheaterRef = receiveTheaterRef;

// ================= RENDER DASHBOARD =================
async function buildDashboard(role) {
  const c = $('dashboardContent');
  let h = '';
  
  const liveUI = (title) => `<div class="live"><div style="font-weight:bold;margin-bottom:5px;width:100%">${title} (M0005)</div><div class="vg" style="display:flex;gap:10px;flex-wrap:wrap;width:100%">
      <div class="vi"><div class="l">🌡️ Joto</div><div class="v live-temp">--</div></div>
      <div class="vi"><div class="l">❤️ BP</div><div class="v live-bp">--/--</div></div>
      <div class="vi"><div class="l">💓 Pulse</div><div class="v live-pulse">--</div></div>
      <div class="vi"><div class="l">👶 FHR</div><div class="v live-fhr">--</div></div>
  </div></div>`;
  
  const emgUI = (name) => `<div class="em"><h3 style="color:#d32f2f;border:none;padding:0">🚨 DHARURA</h3><button class="pulse" onclick="triggerEmergency('Dharura ya ${name}')">OMBA MSAADA</button></div>`;

  function triageUI(all) {
    let r=[], m=[], n=[];
    Object.keys(all).forEach(k=>{
      let d=all[k], b=parseInt(d.bp_sys)||0, t=parseFloat(d.temp)||0;
      if(b>=140||t>=38) r.push({name:k,...d});
      else if(d.visits&&d.visits.length===0) m.push({name:k,...d});
      else n.push({name:k,...d});
    });
    const list=(arr,mt)=>arr.length?arr.slice(0,5).map(p=>`<li onclick="viewPatient('${p.name}')"><div><div class="p-name">${p.name}</div><div class="p-meta">BP: ${p.bp_sys||'-'}/${p.bp_dia||'-'} | Joto: ${p.temp||'-'}°C</div></div><button class="btn2 b-b">Kadi</button></li>`).join(''):`<li style="padding:10px;text-align:center;color:#888">${mt}</li>`;
    return `<div class="triage-grid">
      <div class="t-card risk"><div class="t-head"><span>🔴 Hatari</span><span>${r.length}</span></div><ul class="t-list">${list(r,'Hakuna')}</ul></div>
      <div class="t-card monit"><div class="t-head"><span>🟡 Ufuatiliaji</span><span>${m.length}</span></div><ul class="t-list">${list(m,'Hakuna')}</ul></div>
      <div class="t-card norm"><div class="t-head"><span>🟢 Salama</span><span>${n.length}</span></div><ul class="t-list">${list(n,'Hakuna')}</ul></div>
    </div>`;
  }

  if (role === 'mteja') {
    const user = sessionStorage.getItem('msl_user'); const d = await getClient(user);
    const contacts = d.importantContacts || [];
    let cHtml = contacts.map((x,i)=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:8px"><span><b>${x.name}</b> (${x.relationship}) - ${x.phone}</span><button class="btn2 b-r" onclick="delContact(${i})">Futa</button></div>`).join('') || '<p>Hakuna ndugu.</p>';
    const fHtml = contacts.length < 5 ? `<form onsubmit="addContact(event)" style="margin-top:10px"><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px"><input id="cName" placeholder="Jina" required><input id="cPhone" placeholder="Simu" required><input id="cRel" placeholder="Uhusiano" required></div><button class="btn2 b-g" style="margin-top:5px">Ongeza</button></form>` : '<p style="color:red">Max 5.</p>';
    h = `${liveUI('Data Yako')}${emgUI('Mteja')}<div class="card"><h3>📈 Grafu Yako (Live)</h3><div class="chart-box"><canvas id="mtejaChart"></canvas></div></div><div class="card"><h3>🚨 Ndugu wa Dharura (Max 5)</h3>${cHtml}${fHtml}</div>`;
    setTimeout(() => {
      const ctx = $('mtejaChart'); if(!ctx) return; if(myChart) myChart.destroy();
      myChart = new Chart(ctx, { type: 'line', data: { labels: [], datasets: [{ label: 'Joto', data: [], borderColor: '#c62828' }, { label: 'BP Sys', data: [], borderColor: '#0277bd' }] }, options: { responsive: true, maintainAspectRatio: false } });
    }, 200);
  }
  else if (role === 'chw') {
    const cl = await getClients(); let tot=0, fol=[];
    Object.keys(cl).forEach(k=>{ let d=cl[k]; if(d.status!=='pregnant'&&d.status!=='postnatal')return; tot++; let lv = d.visits && d.visits.length > 0 ? new Date(d.visits[d.visits.length-1].date).getTime() : 0; if(!lv || (Date.now()-lv)>7*86400000) fol.push({name:k, phone:d.phone, loc:d.location}); });
    const opts = Object.keys(cl).map(k=>`<option value="${k}">${k}</option>`).join('');
    const fRows = fol.map(f=>`<tr><td>${f.name}</td><td>${f.loc}</td><td><button class="btn2 b-b" onclick="viewPatient('${f.name}')">Kadi</button></td></tr>`).join('') || '<tr><td colspan="3">Wote wamepima.</td></tr>';
    h = `${liveUI('Data ya CHW')}${emgUI('CHW')}<div class="card"><h3>🚨 Wanaohitaji Kufuatiliwa</h3><table><thead><tr><th>Mteja</th><th>Eneo</th><th>Kadi</th></tr></thead><tbody>${fRows}</tbody></table></div><div class="card"><h3>🚨 Ripoti Dharura</h3><select id="chwPatientSelect">${opts}</select><button class="btn b-r" onclick="triggerEmergency('CHW Dharura')">TUMA</button></div>`;
  }
  else if (role === 'nurse_labour') {
    const cl = await getClients(); const lm = Object.keys(cl).filter(k=>cl[k].status==='pregnant'||cl[k].status==='labour').map(k=>({name:k,...cl[k]}));
    const opts = lm.map(m=>`<option value="${m.name}">${m.name}</option>`).join('');
    h = `${liveUI('Mama Labour')}${emgUI('Labour')}${triageUI(cl)}<div class="card"><h3>🤰 Sajili Kujifungua</h3><form onsubmit="saveLabour(event)"><select id="labourPatientSelect" required>${opts}</select><select id="deliveryMode" required><option>Kawaida (SVD)</option><option>Upasuaji (C/S)</option></select><textarea id="deliveryNotes" placeholder="Maoni..." required></textarea><button class="btn b-g">HAMISHIA POSTNATAL</button></form></div>`;
  }
  else if (role === 'nurse_postnatal') {
    const cl = await getClients(); const pn = Object.keys(cl).filter(k=>cl[k].status==='postnatal');
    let rows = pn.map(n=>`<tr><td>${n}</td><td>${cl[n].deliveryMode}</td><td><button class="btn2 b-b" onclick="viewPatient('${n}')">Kadi</button></td></tr>`).join('') || '<tr><td colspan="3">Hakuna.</td></tr>';
    h = `${liveUI('Mama Postnatal')}${emgUI('Postnatal')}${triageUI(cl)}<div class="card"><h3>🛏️ Wateja Postnatal</h3><table><thead><tr><th>Mama</th><th>Njia</th><th>Kadi</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  else if (role === 'nurse_rch' || role === 'admin') {
    const cl = await getClients();
    h = `${liveUI('RCH/Admin')}${emgUI('RCH')}${triageUI(cl)}`;
  }
  else if (role === 'nurse_theater') {
    const cl = await getClients(); const allP = Object.keys(cl).map(k => ({name:k, ...cl[k]}));
    const options = allP.map(p => `<option value="${p.name}">${p.name}</option>`).join('');
    const surgs = await dbGet('surgeries', []); const refs = await getReferrals(); const refsP = refs.filter(r=>r.status==='pending');
    const reqs = await dbGet('theaterSupplies', {});
    let refRows = refsP.map(r=>`<tr><td>${r.clientName}</td><td>${r.fromFacility}</td><td>${r.reason}</td><td><button class="btn2 b-g" onclick="receiveTheaterRef(${r.id})">Pokea</button></td></tr>`).join('') || '<tr><td colspan="4">Hakuna.</td></tr>';
    let surgRows = surgs.map(s=>`<tr><td>${s.clientName}</td><td>${s.date}</td><td>${s.reason}</td><td><span class="badge bg-y">${s.status}</span></td></tr>`).join('') || '<tr><td colspan="4">Hakuna.</td></tr>';
    let reqRows = Object.values(reqs).map(r=>`<tr><td>${r.clientName}</td><td>${r.type}</td><td>${r.details}</td><td>${fmtTime(r.timestamp)}</td></tr>`).join('') || '<tr><td colspan="4">Hakuna.</td></tr>';
    let listRows = allP.map(p=>`<tr><td>${p.name}</td><td>${p.status}</td><td><button class="btn2 b-b" onclick="viewPatient('${p.name}')">Kadi & Graph</button></td></tr>`).join('');
    
    h = `${liveUI('Theater')}${emgUI('Theater')}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="card"><h3>📥 Rufaa za Upasuaji</h3><table><thead><tr><th>Mteja</th><th>Kutoka</th><th>Sababu</th><th>Pokea</th></tr></thead><tbody>${refRows}</tbody></table></div>
        <div class="card"><h3>🩸 Omba Damu/Dawa</h3><form onsubmit="reqSupply(event)"><select id="supClient" required><option value="">-- Chagua --</option>${options}</select><select id="supType"><option>Damu (Maabara)</option><option>Dawa (Pharmacy)</option></select><input id="supDetails" placeholder="Mf. O+" required><button class="btn b-r" style="padding:6px">TUMA</button></form><table style="margin-top:8px"><thead><tr><th>Mteja</th><th>Aina</th><th>Maelezo</th><th>Muda</th></tr></thead><tbody>${reqRows}</tbody></table></div>
      </div>
      <div class="card"><h3>📅 Panga Upasuaji</h3><form onsubmit="schedSurg(event)"><div class="grid"><select id="surgClient" required><option value="">-- Chagua --</option>${options}</select><input type="date" id="surgDate" required><input id="surgReason" placeholder="Sababu" required></div><button class="btn b-p" style="margin-top:5px">PANGIA</button></form><table style="margin-top:10px"><thead><tr><th>Mteja</th><th>Tarehe</th><th>Sababu</th><th>Hali</th></tr></thead><tbody>${surgRows}</tbody></table></div>
      <div class="card"><h3>📋 Wateja Wote</h3><table><thead><tr><th>Jina</th><th>Hali</th><th>Kadi</th></tr></thead><tbody>${listRows}</tbody></table></div>`;
  }
  else if (role === 'lab_tech') {
    const reqs = await dbGet('theaterSupplies', {}); const list = Object.values(reqs).filter(r=>r.type==='Damu (Maabara)');
    h = `${liveUI('Maabara')}${emgUI('Maabara')}<div class="card"><h3>🩸 Maombi ya Damu</h3><table><thead><tr><th>Mteja</th><th>Maelezo</th><th>Muda</th></tr></thead><tbody>${list.map(r=>`<tr><td>${r.clientName}</td><td>${r.details}</td><td>${fmtTime(r.timestamp)}</td></tr>`).join('')||'<tr><td colspan="3">Hakuna</td></tr>'}</tbody></table></div>`;
  }
  else if (role === 'driver') {
    h = `${liveUI('Dereva')}${emgUI('Dereva')}
      <div class="card" style="border:2px solid #d32f2f">
        <h3>📍 Ramani: Mteja Alipo (GPS Live)</h3>
        <div id="driverMap"></div>
      </div>
      <div class="card">
        <h3>🚑 Safari Zilizokamilika</h3>
        <p>Hakuna safari mpya kwa sasa.</p>
      </div>`;
    setTimeout(initDriverMap, 300);
  }
  else if (role === 'coordinator') {
    const tr = await getTransfers(); const emg = await dbGet('emergencies', {});
    const users = await dbGet('users', {}); const activeEmgs = Object.values(emg).filter(e=>e.status==='active'&&isFresh(e.timestamp));
    const pend = tr.filter(t=>t.status==='pending');
    let roster = Object.keys(users).map(p=>{let u=users[p];if(u.role&&u.role!=='mteja')return `<tr><td>${u.name||p}</td><td>${u.role}</td><td>${p}</td><td><span class="badge bg-g">Kazini</span></td></tr>`;}).join('');
    let trans = pend.map(t=>`<tr><td>${t.clientName}</td><td>${t.toFacility}</td><td>${t.reason}</td><td><button class="btn2 b-g" onclick="appTrans(${t.id})">Kubali</button></td></tr>`).join('')||'<tr><td colspan="4">Hakuna.</td></tr>';
    let actEmg = activeEmgs.map(e=>`<tr><td>${e.clientName}</td><td>${e.type}</td><td>${fmtTime(e.timestamp)}</td><td><button class="btn2 b-o" onclick="$('redirectEmgId').value='${e.id}';$('redirectModal').classList.add('on')">Elekeza</button></td></tr>`).join('')||'<tr><td colspan="4">Hakuna.</td></tr>';
    h = `${liveUI('Mratibu')}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="card"><h3>🚨 Dharura Hai</h3><table><thead><tr><th>Mteja</th><th>Aina</th><th>Muda</th><th>Elekeza</th></tr></thead><tbody>${actEmg}</tbody></table></div>
        <div class="card"><h3>👨‍⚕️ Roster</h3><table><thead><tr><th>Jina</th><th>Wadhifa</th><th>Simu</th><th>Hali</th></tr></thead><tbody>${roster}</tbody></table></div>
      </div>
      <div class="card"><h3>🔄 Maombi ya Uhamisho</h3><table><thead><tr><th>Mteja</th><th>Kwenda</th><th>Sababu</th><th>Kitendo</th></tr></thead><tbody>${trans}</tbody></table></div>`;
  }
  c.innerHTML = h;
}

// ================= INIT =================
window.onload = () => {
  if (sessionStorage.getItem('msl_logged') === 'true' && sessionStorage.getItem('msl_role')) {
    $('loginPage').style.display='none'; $('dashboardPage').style.display='flex';
    $('displayName').textContent = sessionStorage.getItem('msl_user');
    myRole = sessionStorage.getItem('msl_role');
    const RL = { mteja:'Mteja', chw:'CHW', driver:'Dereva', nurse_labour:'Labour Ward', nurse_postnatal:'Postnatal Ward', nurse_rch:'RCH Clinic', nurse_theater:'Theater', lab_tech:'Maabara', coordinator:'Mratibu', admin:'Admin' };
    $('displayRole').textContent = RL[myRole] || myRole;
    buildDashboard(myRole); startEmergencyListener(); fetchLiveVitals(); setInterval(fetchLiveVitals, 5000);
  } else {
    $('loginPage').style.display='flex'; $('dashboardPage').style.display='none';
  }
};
